<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archery | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.ts"></script>
</head>

<body>
    <h1>Archery | experiment</h1>
    <section>
        <h2>Flight</h2>
        <p>Side view of a flat meadow, 100 m wide. One arc per power, from a quarter to full. Angle: <input id="angle" type="range" min="-10" max="45" value="4"> <code id="angle-value"></code></p>
        <canvas id="flight" width="1000" height="260" style="inline-size: 100%; background: #9fd6f0; border-radius: 8px"></canvas>
    </section>
    <section>
        <h2>Draw and fatigue</h2>
        <p>Hold space to draw, let go to shoot. Hold it long: the sway grows, the edges darken, then the arrow slips and you pant.</p>
        <canvas id="draw" width="1000" height="260" style="inline-size: 100%; background: #24301c; border-radius: 8px"></canvas>
        <pre id="draw-state"></pre>
    </section>
</body>

</html>
