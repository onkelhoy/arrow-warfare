<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script type="module" defer src="main.ts"></script>
</head>

<body>
    <canvas>Your browser does not support HTML canvas</canvas>
    <form class="panel">
        <label>Seed <input name="seed" type="number" value="1"></label>
        <label>Size
            <select name="size">
                <option value="small">small</option>
                <option value="medium" selected>medium</option>
                <option value="large">large</option>
            </select>
        </label>
        <label>Trees
            <select name="trees">
                <option value="none">none</option>
                <option value="few" selected>few</option>
                <option value="many">many</option>
            </select>
        </label>
        <label>Light
            <select name="palette">
                <option value="clock">by the clock</option>
                <option value="night">night</option>
                <option value="dawn">dawn</option>
                <option value="noon">noon</option>
                <option value="sunset">sunset</option>
            </select>
        </label>
        <label>View
            <select name="view">
                <option value="above">from above</option>
                <option value="models">models</option>
                <option value="spawns">spawns (6 players, 2 teams)</option>
                <option value="backdrop">the backdrop, from the middle</option>
            </select>
        </label>
    </form>
    <p class="stats"></p>
</body>

</html>
