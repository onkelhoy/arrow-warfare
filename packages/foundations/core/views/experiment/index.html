<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.ts"></script>
</head>

<body>
    <h1>Core | experiment</h1>
    <section>
        <h2>Theme</h2>
        <p>The medieval look. Flip the codeblock's theme toggle for dark.</p>
        <pap-codeblock display="both" color="checker">
            <div class="aw-panel" style="display: grid; gap: 14px; justify-items: start; max-inline-size: 26rem">
                <h3 class="aw-title" style="font-size: 2.4rem">Arrow Warfare</h3>
                <p class="aw-ribbon">The Lobby</p>
                <p style="margin: 0">Parchment panel with ink text.</p>
                <pap-input placeholder="Your name"></pap-input>
                <div style="display: flex; gap: 10px; flex-wrap: wrap">
                    <pap-button color="primary">Host</pap-button>
                    <pap-button>Ready</pap-button>
                    <pap-button variant="outline">Back</pap-button>
                    <pap-button variant="clear" size="small">Host my own</pap-button>
                    <pap-button disabled>Waiting</pap-button>
                </div>
            </div>
        </pap-codeblock>
    </section>
    <section>
        <h2>Words</h2>
        <p id="title"></p>
    </section>
    <section>
        <h2>Colours</h2>
        <p id="colours"></p>
    </section>
    <section>
        <h2>Skins</h2>
        <p id="skins"></p>
    </section>
    <section>
        <h2>Saved settings</h2>
        <pre id="settings"></pre>
    </section>
</body>

</html>
