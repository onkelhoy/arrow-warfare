<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound | experiment</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />

    <script defer type="module" src="main.ts"></script>
</head>

<body>
    <h1>Sound | experiment</h1>
    <section>
        <h2>Playlists</h2>
        <p>Songs and lists come from <code>asset/audio/songs.json</code> in the root, run a build of <code>packages/game</code> once so they're copied in.</p>
        <p class="row">
            <pap-button data-list="lobby">Lobby playlist</pap-button>
            <pap-button data-list="game">Game playlist</pap-button>
            <pap-button data-list="">Stop</pap-button>
            <pap-button id="next">Next song</pap-button>
            <pap-button id="dip">Dip music</pap-button>
        </p>
        <label>Music <input id="music" type="range" min="0" max="1" step=".01" value=".6"></label>
    </section>
</body>

</html>
