<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragdoll | experiment</title>
    <link rel="stylesheet" href="style.css" />
    <script defer type="module" src="main.ts"></script>
</head>

<body>
    <h1>Ragdoll | experiment</h1>
    <section>
        <h2>Thrown onto hills</h2>
        <p>Side view. Click to shoot the stick body in the chest from the left, harder further right. Slow motion: <input id="slow" type="range" min="0.05" max="1" step="0.05" value="1"></p>

        <pre id="state"></pre>
    </section>
